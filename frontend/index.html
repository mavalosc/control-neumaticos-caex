<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control Predictivo de Neumáticos CAEX | Pórtico Dimensional OTR</title>
  <!-- Google Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  
  <style>
    :root {
      --bg: #0f141c;
      --card: #18202c;
      --card-hover: #1e2837;
      --border: #2a3649;
      --ink: #f0f4f8;
      --muted: #8b9bb4;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-border: #dc2626;
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-border: #d97706;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-border: #059669;
      --neutral: #64748b;
      --neutral-bg: rgba(100, 116, 139, 0.15);
    }

    [data-theme="light"] {
      --bg: #f3f5f8;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --border: #d7e0ea;
      --ink: #0f172a;
      --muted: #627282;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --danger-border: #f87171;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --warning-border: #fcd34d;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --neutral: #64748b;
      --neutral-bg: #f1f5f9;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Laser sweep animation for CAEX scanner portal */
    @keyframes scan-laser {
      0% { top: 0%; opacity: 0.75; }
      50% { top: 96%; opacity: 1; }
      100% { top: 0%; opacity: 0.75; }
    }
    .animate-laser {
      animation: scan-laser 2s infinite ease-in-out;
    }

    /* Smooth transitions */
    .theme-transition {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
  </style>
</head>
<body class="h-full flex flex-col theme-transition text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div style="background:#b45309;color:#fff;padding:8px 16px;font:600 13px system-ui,sans-serif;text-align:center">VERSIÓN ANTIGUA (Entrega 4, 11-10-2026). La versión vigente está en <code>src/index.html</code>.</div>

  <!-- TOP BAR -->
  <header class="border-b border-[var(--border)] bg-[var(--card)] sticky top-0 z-40 px-4 lg:px-8 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand & Project Info -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center shadow-lg shadow-amber-500/20 text-white font-bold text-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-bold text-base tracking-tight text-[var(--ink)]">CAEX Neumáticos</span>
            <span class="text-xs px-2 py-0.5 rounded-full font-mono font-medium bg-blue-500/10 text-blue-400 border border-blue-500/30">Pórtico 3D v1.3</span>
          </div>
          <p class="text-xs text-[var(--muted)] hidden sm:block">Control Predictivo OTR · Minería a Cielo Abierto · USACH Equipo 3</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1 sm:gap-2 bg-[var(--bg)] p-1 rounded-xl border border-[var(--border)]">
        <button id="nav-tablero" onclick="navigate('#/')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-[var(--muted)] hover:text-[var(--ink)] flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span>Tablero</span>
        </button>
        <button id="nav-camiones" onclick="navigate('#/c')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-[var(--muted)] hover:text-[var(--ink)] flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
          <span>Camiones</span>
        </button>
        <button id="nav-ordenes" onclick="navigate('#/o')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-[var(--muted)] hover:text-[var(--ink)] flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
          <span>Órdenes</span>
        </button>
        <button id="nav-portico" onclick="navigate('#/sim')" class="px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Simulador Pórtico</span>
        </button>
      </nav>

      <!-- Right Actions: Theme Toggle & Reset Data -->
      <div class="flex items-center gap-2">
        <button onclick="toggleTheme()" class="p-2 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--muted)] hover:text-[var(--ink)] text-xs flex items-center justify-center transition-all" title="Alternar tema claro/oscuro">
          <svg id="theme-icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="theme-icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
        <button onclick="resetPrototypeData()" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--bg)] text-[var(--muted)] hover:text-[var(--ink)] text-xs font-mono transition-all" title="Restaurar datos iniciales">
          ↺ Reset
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 pb-16"></main>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast" class="fixed top-20 right-6 z-50 transform transition-all duration-300 translate-y-[-20px] opacity-0 pointer-events-none max-w-md bg-[var(--card)] border border-[var(--border)] p-4 rounded-xl shadow-2xl flex items-start gap-3"></div>

  <!-- SCRIPT ENGINE -->
  <script>
    // --- ESTADO Y CONFIGURACIÓN INICIAL DEL PROTOTIPO ---
    const STORAGE_KEY = "caex_neumaticos_v1";

    const DAMAGE_NAMES = ["Sin daño", "Leve", "Moderado", "Crítico"];
    const DAMAGE_COLORS = ["var(--success)", "var(--warning)", "#f97316", "var(--danger)"];
    const DAMAGE_BG = ["var(--success-bg)", "var(--warning-bg)", "rgba(249,115,22,0.15)", "var(--danger-bg)"];

    const INITIAL_TRUCKS = [
      ["CAEX-101", "Cat 793F", "16.791 h", [1687, 3365, 1548, 3971, 6571, 7741]],
      ["CAEX-102", "Cat 793F", "13.622 h", [1285, 4359, 34, 3206, 2247, 441]],
      ["CAEX-103", "Komatsu 930E-4", "21.087 h", [1597, 3624, 4566, 2390, 392, 4121]],
      ["CAEX-104", "Cat 797F", "18.450 h", [2100, 480, 3300, 1850, 2760, 4020]],
      ["CAEX-105", "Komatsu 930E-4", "14.120 h", [1320, 168, 2410, 3050, 106, 1980]],
      ["CAEX-106", "Cat 793F", "19.830 h", [2210, 95, 1740, 150, 143, 3320]]
    ];

    const INITIAL_KNOWN_TIRES = {
      "102-3": ["5980R63-2426-1348", 20.4, 1.17, "24-09-2026", 104], // 104°C sobrecalentamiento
      "106-2": ["5980R63-2328-1590", 21.7, 1.79, "21-09-2026", 82],
      "105-5": ["5980R63-2345-1534", 21.2, 1.14, "20-09-2026", 79],
      "106-5": ["5980R63-2618-1611", 22.3, 1.61, "21-09-2026", 88],
      "106-4": ["5980R63-2531-1596", 22.9, 1.94, "21-09-2026", 85],
      "105-2": ["5980R63-2312-1561", 24.1, 2.44, "20-09-2026 (obs.)", 92]
    };

    const INITIAL_DAMAGES = {
      "102-3": [3, "corte profundo en flanco", 0.94],
      "106-4": [2, "roca incrustada en la banda", 0.88],
      "106-2": [1, "desgaste irregular", 0.76]
    };

    const INITIAL_ORDERS = [
      ["ot-0068", "26-09-2026 10:59", "5980R63-2531-1596", "retiro", "Retiro programado por proyección de 150 h remanentes a la tasa observada de 1,94 mm/100 h; banda en 22,9 mm contra umbral de 20 mm. Ingresa serial de bodega 5980R63-B-544. Coordinar con despacho para sacar el CAEX del ciclo al inicio de la ventana; dejar la goma retirada en la cancha de garantía con el serial legible para el reclamo al proveedor.", "29-09-2026", "turno A, 08:00 a 12:00", 150, "med-2494", "22,9 mm, tasa observada", "programada", ["26-09-2026 10:59 · planificador · emisión inicial en SAP PM"]],
      ["ot-0067", "26-09-2026 09:24", "5980R63-2328-1590", "retiro", "Retiro programado por proyección de 95 h remanentes a la tasa observada de 1,79 mm/100 h; banda en 21,7 mm contra umbral de 20 mm.", "29-09-2026", "turno B, 20:00 a 00:00", 95, "med-2492", "21,7 mm, tasa observada", "programada", []],
      ["ot-0066", "25-09-2026 16:40", "5980R63-2345-1534", "retiro", "Retiro programado por proyección de 106 h remanentes.", "30-09-2026", "turno A, 08:00 a 12:00", 106, "med-2490", "21,2 mm, tasa observada", "programada", []],
      ["ot-0065", "25-09-2026 11:05", "5980R63-2312-1561", "retiro", "Retiro programado por proyección de 168 h remanentes.", "30-09-2026", "turno B, 20:00 a 00:00", 168, "med-2488", "24,1 mm, tasa observada", "programada", []],
      ["ot-0064", "24-09-2026 15:12", "5980R63-2218-1478", "rotacion", "Rotación por desgaste desigual entre posiciones traseras.", "01-10-2026", "turno A, 08:00 a 12:00", 392, "med-2485", "20,4 mm, tasa observada", "programada", []],
      ["ot-0052", "18-09-2026 08:30", "5980R63-2100-1301", "retiro", "Retiro ejecutado en turno matutino, goma entregada en cancha de garantía bajo acta #891.", "19-09-2026", "turno A, 08:00 a 12:00", 120, "med-2410", "20,2 mm, tasa observada", "ejecutada", []],
      ["ot-0047", "15-09-2026 13:10", "5980R63-2150-1355", "inspeccion", "Anulada: el neumático se rotó antes de la ventana programada.", "16-09-2026", "turno B, 20:00 a 00:00", 480, "med-2380", "20,9 mm, tasa nominal", "anulada", []]
    ];

    const INITIAL_WINDOWS = [
      { id: 1, dia: "29-09-2026", turno: "turno B, 20:00 a 00:00", libres: 2, en: 36, max: 3 },
      { id: 2, dia: "30-09-2026", turno: "turno A, 08:00 a 12:00", libres: 1, en: 56, max: 3 },
      { id: 3, dia: "01-10-2026", turno: "turno B, 20:00 a 00:00", libres: 3, en: 84, max: 3 }
    ];

    const DEFAULT_CAMERAS = [
      { id: "CAM-101", num: 1, pos: "Frontal Centro", estado: "buena", cobertura: "Dirección frontal y banda delantera" },
      { id: "CAM-102", num: 2, pos: "Frontal Derecha (Lateral)", estado: "buena", cobertura: "P2 Delantero Derecho (flanco ext.)" },
      { id: "CAM-103", num: 3, pos: "Lateral Derecha (Centro)", estado: "buena", cobertura: "P4 y P6 Tándem derecho (banda)" },
      { id: "CAM-104", num: 4, pos: "Trasera Derecha (Lateral)", estado: "buena", cobertura: "P6 Trasero Ext Derecho (flanco)" },
      { id: "CAM-105", num: 5, pos: "Trasera Centro", estado: "buena", cobertura: "P3, P4, P5, P6 Banda trasera dual" },
      { id: "CAM-106", num: 6, pos: "Trasera Izquierda (Lateral)", estado: "buena", cobertura: "P3 Trasero Ext Izquierdo (flanco)" },
      { id: "CAM-107", num: 7, pos: "Lateral Izquierda (Centro)", estado: "buena", cobertura: "P3 y P5 Tándem izquierdo (banda)" },
      { id: "CAM-108", num: 8, pos: "Frontal Izquierda (Lateral)", estado: "buena", cobertura: "P1 Delantero Izquierdo (flanco ext.)" }
    ];

    // Carga de estado persistente
    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed.cameras || !parsed.cameras.length) parsed.cameras = JSON.parse(JSON.stringify(DEFAULT_CAMERAS));
          return parsed;
        }
      } catch(e) { console.error("Error loading state", e); }
      return {
        trucks: INITIAL_TRUCKS,
        orders: INITIAL_ORDERS,
        windows: INITIAL_WINDOWS,
        knownTires: INITIAL_KNOWN_TIRES,
        damages: INITIAL_DAMAGES,
        dispatchAlerts: [], // Avisos prioritarios a despacho mina
        cameras: JSON.parse(JSON.stringify(DEFAULT_CAMERAS))
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch(e) { console.error("Error saving state", e); }
    }

    function resetPrototypeData() {
      if (confirm("¿Deseas restaurar los datos del prototipo a su estado original?")) {
        localStorage.removeItem(STORAGE_KEY);
        state = {
          trucks: INITIAL_TRUCKS,
          orders: INITIAL_ORDERS,
          windows: INITIAL_WINDOWS,
          knownTires: INITIAL_KNOWN_TIRES,
          damages: INITIAL_DAMAGES,
          dispatchAlerts: []
        };
        saveState();
        showToast("Datos restaurados a valores de fábrica", "info");
        route();
      }
    }

    // Modelado de los neumáticos a partir de la flota
    function getTires() {
      return state.trucks.flatMap((c, ci) => c[3].map((h, k) => {
        const p = k + 1;
        const key = (101 + ci) + "-" + p;
        const kn = state.knownTires[key];
        const d = state.damages[key];
        const rate = kn ? kn[2] : 1.1;
        const mm = kn ? kn[1] : +(20 + h * rate / 100).toFixed(1);
        const temp = kn ? (kn[4] || 76) : 74 + ((p * 3 + ci * 2) % 18);
        return {
          cx: c[0],
          modelo: c[1] || "Cat 793F",
          horometro: c[2] || "15.000 h",
          pos: p,
          posNombre: ["Delantero Izq (P1)", "Delantero Der (P2)", "Trasero Ext Izq (P3)", "Trasero Int Izq (P4)", "Trasero Int Der (P5)", "Trasero Ext Der (P6)"][k],
          h,
          serial: kn ? kn[0] : `5980R63-${2000 + ci * 137 + p * 53}-${1300 + ci * 61 + p * 17}`,
          rate,
          mm,
          temp,
          seg: h < 500 ? "observada" : "nominal",
          fecha: kn ? kn[3] : "24-09-2026",
          nivel: d ? d[0] : 0,
          dmg: d ? [{ t: d[1], c: d[2] }] : []
        };
      }));
    }

    const zona = h => h == null ? "gris" : h < 200 ? "rojo" : h < 500 ? "amarillo" : "verde";
    const ZN = { rojo: "Rojo (<200h)", amarillo: "Amarillo (<500h)", verde: "Verde (>500h)", gris: "Sin datos" };
    const f = n => String(n).replace(".", ",");
    const H = n => n.toLocaleString("es-CL") + " h";
    const ST = s => getTires().find(t => t.serial === s);

    // Helpers UI
    const $ = document.getElementById("app");
    const navigate = hash => { location.hash = hash; };

    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const icon = type === "danger" 
        ? `<svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
        : `<svg class="w-5 h-5 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
      
      toast.innerHTML = `${icon} <div class="text-xs sm:text-sm font-medium text-[var(--ink)]">${msg}</div>`;
      toast.classList.remove("opacity-0", "translate-y-[-20px]", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-[-20px]", "pointer-events-none");
        toast.classList.remove("opacity-100", "translate-y-0");
      }, 4000);
    }

    function toggleTheme() {
      const isLight = document.documentElement.getAttribute("data-theme") === "light";
      document.documentElement.setAttribute("data-theme", isLight ? "dark" : "light");
      document.getElementById("theme-icon-sun").classList.toggle("hidden", isLight);
      document.getElementById("theme-icon-moon").classList.toggle("hidden", !isLight);
    }

    function updateActiveNav(activeId) {
      ["nav-tablero", "nav-camiones", "nav-ordenes", "nav-portico"].forEach(id => {
        const btn = document.getElementById(id);
        if (!btn) return;
        if (id === activeId) {
          btn.className = btn.className.replace(/text-\[var\(--muted\)\]/g, "").replace(/bg-transparent/g, "");
          btn.classList.add("bg-[var(--card)]", "text-[var(--ink)]", "shadow-sm", "border", "border-[var(--border)]");
        } else if (id !== "nav-portico") {
          btn.classList.remove("bg-[var(--card)]", "text-[var(--ink)]", "shadow-sm", "border", "border-[var(--border)]");
          btn.classList.add("text-[var(--muted)]");
        }
      });
    }

    // Badges visuales
    const renderBadge = n => {
      const names = ["0 · Sin daño", "1 · Leve", "2 · Moderado", "3 · Crítico"];
      const bgs = ["bg-emerald-500/10 text-emerald-400 border-emerald-500/30", "bg-amber-500/10 text-amber-400 border-amber-500/30", "bg-orange-500/10 text-orange-400 border-orange-500/30", "bg-rose-500/10 text-rose-400 border-rose-500/30"];
      return `<span class="inline-flex items-center text-xs font-semibold px-2 py-0.5 rounded-full border ${bgs[n]}">${names[n]}</span>`;
    };

    const renderZonePill = z => {
      const colors = {
        rojo: "bg-rose-500/15 text-rose-400 border-rose-500/30",
        amarillo: "bg-amber-500/15 text-amber-400 border-amber-500/30",
        verde: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30",
        gris: "bg-slate-500/15 text-slate-400 border-slate-500/30"
      };
      const dots = {
        rojo: "bg-rose-500",
        amarillo: "bg-amber-500",
        verde: "bg-emerald-500",
        gris: "bg-slate-500"
      };
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border ${colors[z]}">
        <span class="w-1.5 h-1.5 rounded-full ${dots[z]}"></span>
        <span>${ZN[z]}</span>
      </span>`;
    };

    // --- PANTALLA 1: TABLERO DEL TURNO ---
    let filterZone = "todas";
    let filterRate = "cualquier";
    let searchQuery = "";

    function renderDashboard() {
      updateActiveNav("nav-tablero");
      const tires = getTires();
      const counts = { rojo: 0, amarillo: 0, verde: 0, gris: 0 };
      tires.forEach(t => counts[zona(t.h)]++);

      const filtered = tires.filter(t => {

                <div>

                </div>

              <!-- Gráfico SVG Proyección Temporal -->
              <div class="bg-[var(--bg)] border border-[var(--border)] rounded-xl p-4">
                ${renderTireWearChart(t)}
              </div>

              <div class="space-y-2 text-xs text-[var(--muted)] border-t border-[var(--border)] pt-3">
                <div class="flex justify-between">
                  <span>Proyección estimada de cruce del umbral:</span>
                  <strong class="font-mono text-[var(--ink)]">${H(t.h)} restantes</strong>

                  <span>Tasa actual de desgaste:</span>
                  <strong class="font-mono text-amber-400">${f(t.rate)} mm por cada 100 h</strong>

              <!-- Alerta Despacho en Ficha si daño crítico -->

                  <button onclick="notificarDespacho('${t.cx}', '${t.serial}')" class="bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs px-3 py-1.5 rounded-lg shrink-0">

          <!-- Banda de Acción Recomendada y Agendamiento en Taller (Integrada en el flujo del reporte, sin superposición) -->

              <div class="w-10 h-10 rounded-xl ${isInterventionNeeded ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'} flex items-center justify-center shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              </div>

                <div class="text-xs text-[var(--muted)] font-medium uppercase tracking-wider">Acción recomendada por el sistema:</div>

                  ${isInterventionNeeded ? 'Programar retiro o intervención en ventana de taller' : 'Neumático en condiciones óptimas para continuar operación'}

    function renderTireWearChart(t) {
      const historicalPoints = Array.from({ length: 8 }, (_, i) => +(t.mm + (7 - i) * t.rate).toFixed(2));
      const minVal = Math.min(19, t.mm - 1);
      const maxVal = Math.max(...historicalPoints) + 1;
      const getX = i => 40 + i * 42;
      const getY = v => 15 + ((maxVal - v) / (maxVal - minVal)) * 110;

      const thresholdY = getY(20);

      return `
        <svg viewBox="0 0 380 160" class="w-full h-auto block" role="img">
          <!-- Línea umbral crítico 20mm -->
          <line x1="40" y1="${thresholdY}" x2="360" y2="${thresholdY}" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="2"/>
          <text x="360" y="${thresholdY - 5}" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#ef4444">Umbral de retiro 20,0 mm</text>

          <!-- Polilínea de mediciones históricas -->
          <polyline fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${historicalPoints.map((v, i) => `${getX(i)},${getY(v)}`).join(" ")}"/>
          
          <!-- Puntos de medición -->
          ${historicalPoints.map((v, i) => `
            <circle cx="${getX(i)}" cy="${getY(v)}" r="4.5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
            <text x="${getX(i)}" y="${getY(v) - 8}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#94a3b8">${f(v)}</text>
          `).join("")}

          <!-- Eje X etiquetas -->
          <text x="200" y="152" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#64748b">Últimas 8 pasadas por el pórtico</text>
        </svg>
      `;
    }

    function corregirClasificacion(serial, newLevel) {
      const t = ST(serial);
      if (!t) return;
      
      const prevLevel = t.nivel;
      state.damages[(t.cx.split("-")[1]) + "-" + t.pos] = newLevel > 0 
        ? [newLevel, ["", "desgaste irregular", "roca incrustada en la banda", "corte profundo en flanco"][newLevel], 1.0]
        : null;

      saveState();
      showToast(`Clasificación actualizada de ${DAMAGE_NAMES[prevLevel]} a ${DAMAGE_NAMES[newLevel]} (registrado en auditoría)`, "info");
      renderTireDetail(serial);
    }

    // --- PANTALLA 4: AGENDAR INTERVENCIÓN EN TALLER ---
    let selectedWindowId = null;

    function renderSchedule(serial) {
      updateActiveNav("");
      const t = ST(serial);
      if (!t) return navigate("#/");

      const selectedWin = state.windows.find(w => w.id === selectedWindowId);

      $.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="flex items-center gap-3 pb-3 border-b border-[var(--border)]">
            <button onclick="navigate('#/n/${serial}')" class="p-2 rounded-xl bg-[var(--card)] hover:bg-[var(--card-hover)] border border-[var(--border)] text-[var(--ink)]">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-[var(--ink)]">Agendar Intervención</h1>
              <p class="text-xs text-[var(--muted)] font-mono">${serial} · ${t.cx} ${t.posNombre} · ${H(t.h)} remanentes</p>
            </div>
          </div>

          <!-- Selección de Ventana de Taller -->
          <div class="space-y-3">
            <div class="text-sm font-semibold text-[var(--ink)]">Selecciona una Ventana Disponible en el Taller de Neumáticos:</div>
            
            <div class="grid grid-cols-1 gap-3">
              ${state.windows.map(w => {
                const isSelected = selectedWindowId === w.id;
                const hasSlots = w.libres > 0;
                const arrivesOnTime = w.en < t.h;

                return `
                  <button onclick="${hasSlots ? `selectedWindowId=${w.id}; renderSchedule('${serial}')` : ''}" class="w-full text-left p-4 rounded-2xl border-2 transition-all ${isSelected ? 'border-blue-500 bg-blue-500/10 shadow-md' : 'border-[var(--border)] bg-[var(--card)] hover:bg-[var(--card-hover)]'} ${!hasSlots ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}">
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="text-base font-bold text-[var(--ink)]">${w.dia} · ${w.turno}</div>
                        <div class="text-xs text-[var(--muted)] mt-0.5">Ventana proyectada para dentro de ${w.en} horas</div>
                      </div>
                      <div class="text-right">
                        <span class="text-xs font-bold font-mono px-2.5 py-1 rounded-full ${hasSlots ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}">
                          ${w.libres} de ${w.max} cupos libres
                        </span>
                      </div>
                    </div>

                    ${isSelected ? `
                      <div class="mt-3 pt-3 border-t border-[var(--border)] text-xs flex items-center gap-2">
                        ${arrivesOnTime ? `
                          <span class="text-emerald-400 font-semibold flex items-center gap-1">
                            ✓ Ventana oportuna: La intervención se ejecutará con ${t.h - w.en} h de margen antes del cruce de umbral.
                          </span>
                        ` : `
                          <span class="text-rose-400 font-semibold flex items-center gap-1">
                            ⚠️ Advertencia de riesgo: El neumático cruzará el umbral ${w.en - t.h} h antes de esta ventana.
                          </span>
                        `}
                      </div>
                    ` : ''}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Resumen de la Orden a Emitir -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 space-y-3">
            <h3 class="text-sm font-bold text-[var(--ink)]">Trazabilidad Dimensional que se escribirá en el ERP:</h3>
            <div class="p-3 bg-[var(--bg)] rounded-xl text-xs font-mono text-[var(--muted)] space-y-1">
              <div>Tipo de Intervención: <strong>RETIRO PROGRAMADO</strong></div>
              <div>Banda Medida: <strong>${f(t.mm)} mm</strong> (contra umbral 20,0 mm)</div>
              <div>Tasa Reciente: <strong>${f(t.rate)} mm/100h (${t.seg})</strong></div>
              <div>Ingreso Bodega: <strong>Serial 5980R63-B-544</strong></div>
              <div>Destino Retiro: <strong>Cancha de Garantía para reclamo a proveedor</strong></div>
            </div>
          </div>

          <!-- Botón de Confirmación -->
          <div class="pt-4">
            <button onclick="emitirOrden('${serial}')" ${selectedWin ? '' : 'disabled'} class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-base py-4 rounded-xl shadow-xl shadow-blue-600/30 transition-all flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span>Confirmar y Emitir Orden en SAP PM</span>
            </button>
          </div>

        </div>
      `;
    }

    function emitirOrden(serial) {
      const t = ST(serial);
      const w = state.windows.find(x => x.id === selectedWindowId);
      if (!t || !w) return;

      w.libres--;
      const newId = "ot-00" + (69 + state.orders.filter(o => +o[0].slice(3) > 68).length);
      const nowStr = new Date().toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" });

      const newOrder = [
        newId,
        nowStr,
        serial,
        "retiro",
        `Retiro programado por proyección de ${t.h} h remanentes a la tasa ${t.seg} de ${f(t.rate)} mm/100 h; banda en ${f(t.mm)} mm contra umbral de 20 mm.${t.dmg.length ? " Daño: " + t.dmg[0].t + "." : ""} Ingresa serial de bodega 5980R63-B-544. Dejar en cancha de garantía para informe semanal.`,
        w.dia,
        w.turno,
        t.h,
        "med-2498",
        `${f(t.mm)} mm, tasa ${t.seg}`,
        "programada",
        [`${nowStr} · planificador · orden emitida con éxito y sincronizada con ERP`]
      ];

      state.orders.unshift(newOrder);
      saveState();

      selectedWindowId = null;
      showToast(`Orden ${newId} emitida con éxito en ERP. Taller notificado.`, "success");
      navigate("#/o");
    }

    // --- PANTALLA 5: ÓRDENES DE TRABAJO ---
    let filterOrderStatus = "todos";
    let filterOrderType = "todos";
    let searchOrderQuery = "";
    let openNotes = {};

    function renderOrders() {
      updateActiveNav("nav-ordenes");
      const counts = {
        programada: state.orders.filter(o => o[10] === "programada").length,
        ejecutada: state.orders.filter(o => o[10] === "ejecutada").length + 54,
        anulada: state.orders.filter(o => o[10] === "anulada").length + 7
      };

      const filtered = state.orders.filter(o => {
        const matchStatus = filterOrderStatus === "todos" || o[10] === filterOrderStatus;
        const matchType = filterOrderType === "todos" || o[3] === filterOrderType;
        const matchText = (o[0] + o[2] + o[4]).toLowerCase().includes(searchOrderQuery.toLowerCase());
        return matchStatus && matchType && matchText;
      });

      $.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-[var(--border)]">

        ...state.orders.map(o => [o[0], o[1], o[2], o[3], o[5], o[6], o[7], o[8], o[10]])
      ];
      const csvContent = "data:text/csv;charset=utf-8," + csvRows.map(e => e.join(";")).join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `informe_neumaticos_caex_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Informe descargado en formato CSV para reunión y reclamo de garantía", "success");
    }

      const curWin = state.windows.find(w => w.dia === o[5] && w.turno === o[6]);
      const newWin = state.windows.find(w => w.id === editState.w);

      if (newWin && (!curWin || curWin.id !== newWin.id)) {
        if (curWin) curWin.libres++;
        newWin.libres--;
        o[5] = newWin.dia;
        o[6] = newWin.turno;
      }

      o[4] = editState.nota;
      o[11] = (o[11] || []).concat(`${nowStr} · planificador · modificación de orden · motivo: ${editState.motivo || 'actualización operacional'}`);

      saveState();
      editState = null;
      showToast(`Orden ${orderId} actualizada correctamente`, "success");
      navigate("#/o");

              <div class="absolute bottom-2 left-2 bg-slate-950/85 backdrop-blur-md px-2 py-0.5 rounded-lg border border-slate-700/60 flex items-center gap-1 text-[10px] z-10">
                <span class="w-2 h-2 rounded-full ${isSimulating ? 'bg-emerald-400 animate-pulse' : 'bg-slate-400'}"></span>
                <span class="font-mono text-slate-300"><strong class="text-white">${simSelectedTruck}</strong></span>
              </div>
              <div class="absolute top-2 right-2 bg-black/80 backdrop-blur px-2 py-0.5 rounded text-[10px] font-mono text-amber-300 border border-amber-500/30 z-10">
                RFID P-100
              </div>
            </div>

            <!-- Panel de Estado del Pórtico Láser -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs font-mono">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${isSimulating ? 'bg-rose-500 animate-ping' : 'bg-emerald-500 shadow-[0_0_8px_#10b981]'}"></span>
                <span class="text-emerald-400 font-bold">ESTADO PÓRTICO P-100:</span>
                <span class="text-slate-200">${isSimulating ? 'ESCANEANDO SENSORES 3D Y CÁMARAS (EN PROCESO)' : 'CALIBRADO Y LISTO PARA DETECCIÓN'}</span>
              </div>
              <div class="flex items-center gap-4 text-[11px] text-slate-400">
                <span>Precisión: ±0,5 mm</span>
                <span>Termografía: P1 a P6</span>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 2: REGISTRO DE TELEMETRÍA SENSORIAL DE LA PASADA -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 space-y-3 shadow-sm">
            <h3 class="text-xs font-bold text-[var(--ink)] uppercase tracking-wider flex items-center gap-2">
              <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
              Registro de Telemetría Sensorial de la Pasada
            </h3>
            
            <div id="sim-terminal" class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-300 space-y-1 max-h-52 overflow-y-auto">
              ${simLog.length ? simLog.map(l => `<div>${l}</div>`).join("") : `
                <div class="text-slate-600">// Presiona "Iniciar Pasada en Tránsito" para activar la telemetría del camión seleccionado en el Pórtico P-100...</div>
              `}
            </div>
          </div>

          <!-- SECCIÓN 3: DESPLIEGUE INDICANDO QUE EL CAMIÓN PASÓ POR EL PÓRTICO P-100 -->
          <div class="p-5 rounded-2xl bg-gradient-to-r from-blue-950/80 via-slate-900 to-slate-950 border-2 border-blue-500/50 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl bg-blue-600/20 text-blue-400 border border-blue-500/40 flex items-center justify-center shrink-0 shadow-lg">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-blue-400">Punto de Control Operacional</span>
                  <span class="text-xs font-mono font-black px-2.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/40">PÓRTICO P-100</span>
                  <span class="text-[11px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-mono border border-emerald-500/30">En Tránsito (4 kph)</span>
                </div>
                <h3 class="text-lg font-bold text-[var(--ink)] mt-1">
                  Paso Registrado: El camión <span class="text-amber-400 font-mono">${simSelectedTruck}</span> atravesó exitosamente el Pórtico P-100
                </h3>
                <p class="text-xs text-[var(--muted)] mt-0.5">
                  Ubicación: Salida Taller Central / Estación de Combustible · Cobertura dimensional: 6 de 6 neumáticos escaneados
                </p>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <div class="text-right">
                <div class="text-xs font-bold text-emerald-400 flex items-center gap-1.5 justify-end">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  CAPTURA CONFIRMADA
                </div>
                <div class="text-[11px] font-mono text-[var(--muted)]">Trazabilidad enviada a ERP</div>
              </div>
            </div>
          </div>

          <!-- SECCIÓN 4: ARREGLO DE 8 CÁMARAS (CAM-101 A CAM-108) + IMAGEN DE DISTRIBUCIÓN -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-md space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border)]">
              <div>
                <h2 class="text-lg font-bold text-[var(--ink)] flex items-center gap-2">
                  Arreglo de Cámaras del Pórtico P-100
                  <span class="text-xs font-mono px-2.5 py-0.5 rounded-full ${allCamsOk ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}">
                    ${camsBuenas} de ${totalCams} Operativas
                  </span>
                </h2>
                <p class="text-xs text-[var(--muted)] mt-0.5">8 cámaras ópticas perimetrales (CAM-101 a CAM-108) para cobertura total de los 6 neumáticos</p>
              </div>

              <div class="flex items-center gap-2">
                <span class="text-xs font-medium text-[var(--muted)] flex items-center gap-1.5">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span> Operativa (Buena)
                </span>
                <span class="text-xs font-medium text-[var(--muted)] flex items-center gap-1.5 ml-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_#ef4444]"></span> En Falla (Alerta)
                </span>
              </div>
            </div>

            <!-- Grilla: Imagen de Distribución + Lista Detallada de Cámaras -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              
              <!-- Columna Imagen: Distribución física de las 8 cámaras -->
              <div class="lg:col-span-5 bg-slate-950 p-3 rounded-2xl border border-slate-800 shadow-inner space-y-2">
                <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center font-mono">
                  Distribución Perimetral de Sensores en Pórtico
                </div>
                <div class="overflow-hidden rounded-xl border border-slate-800">
                  <img src="./assets/distribucion-camaras.jpg" alt="Distribución de Cámaras Pórtico" class="w-full h-auto object-cover block hover:scale-105 transition-transform duration-300">
                </div>
                <div class="text-[10px] text-slate-500 text-center font-mono">
                  Diagrama: 8 cámaras perimetrales con visión cruzada en avance a 4 kph
                </div>
              </div>

              <!-- Columna Telemetría: Lista de CAM-101 a CAM-108 -->
              <div class="lg:col-span-7 space-y-2.5">
                <div class="text-xs font-bold uppercase tracking-wider text-[var(--muted)] mb-1 flex justify-between items-center">
                  <span>Reporte Individual de Sensores Ópticos:</span>
                  <span class="text-[11px] text-[var(--muted)]">Clic en el estado para simular falla/reparación</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${state.cameras.map(cam => {
                    const isOk = cam.estado === "buena";
                    return `
                      <div class="p-3 rounded-xl border transition-all ${isOk ? 'bg-[var(--bg)] border-[var(--border)] hover:border-emerald-500/50' : 'bg-rose-500/10 border-rose-500/40 shadow-rose-950/20'} flex flex-col justify-between">
                        <div class="flex items-start justify-between gap-2">
                          <div>
                            <div class="flex items-center gap-1.5">
                              <span class="text-xs font-mono font-bold text-[var(--ink)]">${cam.id}</span>
                              <span class="text-[11px] text-[var(--muted)]">· Cám #${cam.num}</span>
                            </div>
                            <div class="text-xs font-semibold text-[var(--ink)] mt-0.5">${cam.pos}</div>
                            <div class="text-[10px] text-[var(--muted)] mt-0.5 font-mono">${cam.cobertura}</div>
                          </div>

                          <!-- Luz indicadora verde/roja interactiva -->
                          <button onclick="toggleCamEstado('${cam.id}')" title="Clic para alternar estado" class="flex items-center gap-1.5 px-2 py-1 rounded-lg border text-xs font-bold transition-all ${isOk ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/25' : 'bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30'}">
                            <span class="w-2.5 h-2.5 rounded-full ${isOk ? 'bg-emerald-400 shadow-[0_0_8px_#10b981]' : 'bg-rose-500 shadow-[0_0_8px_#ef4444] animate-ping'}"></span>
                            <span>${isOk ? 'Buena' : 'En Falla'}</span>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>

                <!-- Resumen de Operatividad del Pórtico -->
                <div class="mt-3 p-3 rounded-xl bg-[var(--bg)] border border-[var(--border)] flex items-center justify-between text-xs font-mono">
                  <span class="text-[var(--muted)]">Diagnóstico de Red de Cámaras:</span>
                  <span class="${allCamsOk ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}">
                    ${allCamsOk ? '✓ Todas las cámaras operativas - Cobertura 100%' : '⚠️ Atención: ' + (totalCams - camsBuenas) + ' cámara(s) en falla - Revisar pórtico'}
                  </span>
                </div>
              </div>

            </div>
          </div>

          <!-- SECCIÓN 5: FOTOS E INSPECCIÓN DE LOS 6 NEUMÁTICOS -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-md space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border)]">
              <div>
                <h2 class="text-lg font-bold text-[var(--ink)]">Inspección Fotográfica y Dimensional de Neumáticos</h2>
                <p class="text-xs text-[var(--muted)] mt-0.5">Captura individual de los 6 neumáticos del ${simSelectedTruck} procesada por el arreglo CAM-101 a CAM-108</p>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 font-mono border border-blue-500/30">
                6 Posiciones OTR 59/80R63
              </span>
            </div>

            <!-- Grilla con las 6 fotos / escaneos de neumáticos -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
              ${currentTruckTires.map(t => {
                const z = zona(t.h);
                const colBadge = z === 'rojo' ? 'text-rose-400 border-rose-500/30 bg-rose-500/10' : z === 'amarillo' ? 'text-amber-400 border-amber-500/30 bg-amber-500/10' : 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10';
                
                // Mapeo de cámaras por posición
                const camMap = {
                  1: "CAM-108 & CAM-101",
                  2: "CAM-101 & CAM-102",
                  3: "CAM-106 & CAM-107",
                  4: "CAM-107 & CAM-105",
                  5: "CAM-103 & CAM-105",
                  6: "CAM-104 & CAM-103"
                };

                return `
                  <div class="bg-[var(--bg)] border border-[var(--border)] hover:border-blue-500/40 rounded-xl p-3.5 space-y-3 transition-all flex flex-col justify-between">
                    <!-- Cabecera de Neumático -->
                    <div class="flex items-start justify-between">
                      <div>
                        <div class="flex items-center gap-1.5">
                          <span class="text-xs font-bold text-[var(--ink)]">P${t.pos} · ${t.posNombre.split(" ")[0]}</span>
                          <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[var(--card)] text-blue-400 border border-[var(--border)]">${t.serial.slice(-8)}</span>
                        </div>
                        <div class="text-[10px] text-[var(--muted)] font-mono mt-0.5">Captura: ${camMap[t.pos] || 'CAM-101'}</div>
                      </div>
                      ${renderBadge(t.nivel)}
                    </div>

                    <!-- Representación Visual Fotográfica / Escaneo de Banda -->
                    <div class="relative bg-slate-900 border border-slate-700/80 rounded-lg overflow-hidden shadow-inner">
                      <svg viewBox="0 0 280 120" class="w-full h-auto block" role="img">
                        <!-- Fondo de goma neumática -->
                        <rect width="280" height="120" fill="#181b22"/>
                        
                        <!-- Patrón de surcos de banda OTR -->
                        ${Array.from({length: 10}, (_, i) => `
                          <rect x="${14 + i * 26}" y="12" width="12" height="96" rx="3" fill="#2d3340" opacity="0.9"/>
                          <line x1="${20 + i * 26}" y1="12" x2="${20 + i * 26}" y2="108" stroke="#0e1116" stroke-width="2.5"/>
                        `).join("")}

                        <!-- Daño marcado si existe -->
                        ${t.dmg.map(d => {
                          const col = DAMAGE_COLORS[t.nivel];
                          return `
                            <rect x="90" y="30" width="100" height="60" fill="none" stroke="${col}" stroke-width="2.5" rx="4" stroke-dasharray="3 2"/>
                            <rect x="90" y="14" width="100" height="16" fill="${col}" rx="3"/>
                            <text x="94" y="26" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">${d.t.slice(0, 16)}</text>
                          `;
                        }).join("")}

                        <!-- Termografía en el flanco -->
                        <text x="10" y="112" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#94a3b8">Temp: ${t.temp}°C | Banda: ${f(t.mm)}mm</text>
                      </svg>

                      <div class="absolute bottom-1 right-1 text-[9px] font-mono bg-black/70 px-1.5 py-0.2 rounded text-slate-300">
                        Pórtico P-100
                      </div>
                    </div>

                    <!-- Métricas Dimensionales -->
                    <div class="grid grid-cols-3 gap-1 text-center bg-[var(--card)] p-2 rounded-lg border border-[var(--border)] text-xs">
                      <div>
                        <div class="text-[10px] text-[var(--muted)]">Profundidad</div>
                        <div class="font-mono font-bold text-[var(--ink)]">${f(t.mm)} mm</div>
                      </div>
                      <div>
                        <div class="text-[10px] text-[var(--muted)]">Horas Rem.</div>
                        <div class="font-mono font-bold ${z === 'rojo' ? 'text-rose-400' : z === 'amarillo' ? 'text-amber-400' : 'text-emerald-400'}">${t.h} h</div>
                      </div>
                      <div>
                        <div class="text-[10px] text-[var(--muted)]">Zona</div>
                        <div class="font-mono font-bold uppercase text-[10px] ${z === 'rojo' ? 'text-rose-400' : z === 'amarillo' ? 'text-amber-400' : 'text-emerald-400'}">${z}</div>
                      </div>
                    </div>

                    <!-- Botón para ver Ficha -->
                    <button onclick="navigate('#/n/${t.serial}')" class="w-full text-center py-1.5 rounded-lg text-xs font-semibold bg-[var(--card)] hover:bg-blue-600 hover:text-white text-[var(--ink)] border border-[var(--border)] transition-all">
                      Ver Ficha Técnica ›
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

        </div>
      `;
    }

    function ejecutarPasadaPortico() {
      isSimulating = true;
      simLog = [
        `[${new Date().toLocaleTimeString()}] Inicializando sincronización en PÓRTICO DIMENSIONAL P-100 para ${simSelectedTruck}...`,
        `[${new Date().toLocaleTimeString()}] Velocidad detectada: 3.8 km/h (Dentro del rango óptimo 2 a 5 km/h)`,
        `[${new Date().toLocaleTimeString()}] Arreglo de 8 cámaras (CAM-101 a CAM-108) sincronizado con escáner LiDAR 3D...`
      ];
      renderSimulator();

      setTimeout(() => {
        const truckIndex = state.trucks.findIndex(c => c[0] === simSelectedTruck);
        if (truckIndex >= 0) {
          const truckTires = state.trucks[truckIndex][3];
          for (let p = 0; p < 6; p++) {
            const key = (101 + truckIndex) + "-" + (p + 1);
            const deltaHours = Math.floor(Math.random() * 25) + 15;
            truckTires[p] = Math.max(20, truckTires[p] - deltaHours);

            if (state.knownTires[key]) {
              state.knownTires[key][1] = +(state.knownTires[key][1] - 0.2).toFixed(1);
              state.knownTires[key][3] = new Date().toLocaleDateString("es-CL");
            }
          }
        }

        simLog.push(
          `[${new Date().toLocaleTimeString()}] ✓ 8 de 8 cámaras operativas (CAM-101 a CAM-108 procesaron imágenes).`,
          `[${new Date().toLocaleTimeString()}] ✓ 6 de 6 neumáticos escaneados con nubes de puntos 3D.`,
          `[${new Date().toLocaleTimeString()}] ✓ Paso validado por Pórtico P-100 y emitido a registro histórico.`,
          `[${new Date().toLocaleTimeString()}] Telemetría enviada al Tablero de Control del Turno.`
        );

        saveState();
        isSimulating = false;
        renderSimulator();
        showToast(`Pasada de ${simSelectedTruck} registrada con éxito en Pórtico P-100`, "success");
      }, 2500);
    }

    // --- ENRUTADOR PRINCIPAL ---
    function route() {
      const hash = location.hash || "#/";
      const [path, param] = hash.replace("#", "").split("/").filter(Boolean);
      window.scrollTo(0, 0);

      if (!path) {
        renderDashboard();
      } else if (path === "c") {
        renderTrucks();
      } else if (path === "o") {
        renderOrders();
      } else if (path === "n" && param) {
        renderTireDetail(param);
      } else if (path === "a" && param) {
        renderSchedule(param);
      } else if (path === "e" && param) {
        renderEditOrder(param);
      } else if (path === "sim") {
        renderSimulator();
      } else {
        renderDashboard();
      }
    }

    window.addEventListener("hashchange", route);
    window.addEventListener("DOMContentLoaded", () => {
      route();
    });
  </script>
</body>
</html>
