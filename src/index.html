    .manual ul, .manual ol { padding-left: 1.4rem; margin: .5rem 0; }
    .manual ul { list-style: disc; } .manual ol { list-style: decimal; }

    .manual blockquote { border-left: 4px solid #f59e0b; background: rgba(245,158,11,.08); padding: .6rem .9rem; border-radius: 0 8px 8px 0; margin: .75rem 0; }
    .manual hr { border-color: var(--border); margin: 1.5rem 0; }

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-border: #059669;
      --neutral: #64748b;
      --neutral-bg: rgba(100, 116, 139, 0.15);
    }

    [data-theme="light"] {
      --bg: #f3f5f8;
      --card: #ffffff;
      --card-hover: #f8fafc;
      --border: #d7e0ea;
      --ink: #0f172a;

      --success: #16a34a;
      --success-bg: #dcfce7;
      --success-border: #86efac;
      --neutral: #64748b;
      --neutral-bg: #f1f5f9;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Laser sweep animation for CAEX scanner portal */
    @keyframes scan-laser {
      0% { top: 0%; opacity: 0.75; }
      50% { top: 96%; opacity: 1; }
      100% { top: 0%; opacity: 0.75; }
    }
    .animate-laser {
      animation: scan-laser 2s infinite ease-in-out;
    }

    /* Smooth transitions */
    .theme-transition {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    async function persistir(escritura) {
      if (!DB.activo) return true;
      try {
        await escritura();
        await sincronizarDesdeBase();
        return true;
      } catch (e) {
        console.error(e);
        showToast(`No se pudo guardar en Supabase: ${e.message}`, "danger");
        await sincronizarDesdeBase().catch(() => {});
        return false;
      } finally {
        route();
      }

        const key = c[0].split("-")[1] + "-" + p;
        const kn = state.knownTires[key];
        const d = state.damages[key];
        const rate = kn ? kn[2] : 1.1;
        const mm = kn ? kn[1] : +(20 + h * rate / 100).toFixed(1);
        const temp = kn ? (kn[4] || 76) : 74 + ((p * 3 + ci * 2) % 18);
        return {
          cx: c[0],
          modelo: c[1] || "Cat 793F",
          horometro: c[2] || "15.000 h",
          pos: p,
          posNombre: ["Delantero Izq (P1)", "Delantero Der (P2)", "Trasero Ext Izq (P3)", "Trasero Int Izq (P4)", "Trasero Int Der (P5)", "Trasero Ext Der (P6)"][k],

      state.dispatchAlerts.push({ caexId, serial, fecha: new Date().toLocaleString("es-CL"), mensaje: msg });
      saveState();
      showToast(msg, "danger");
      renderDashboard();
    }

    // --- PANTALLA 2: VISTA DE CAMIONES (CHASIS Y RUEDAS 6X4) ---
    let truckSearchQuery = "";

    let trucksCurrentPage = 1;
    let trucksPageSize = 12; // 12 por página

    function renderTrucks() {
      updateActiveNav("nav-camiones");
      const tires = getTires();
      const filteredTrucks = state.trucks.filter(c => {
        const text = (c[0] + c[1] + c[2]).toLowerCase();
        const matchText = text.includes(truckSearchQuery.toLowerCase());
        if (!matchText) return false;
        if (truckFilterStatus === "todos") return true;
        const truckTires = tires.filter(t => t.cx === c[0]);
        const reds = truckTires.filter(t => zona(t.h) === "rojo").length;
        const yellows = truckTires.filter(t => zona(t.h) === "amarillo").length;
        if (truckFilterStatus === "rojo") return reds > 0;
        if (truckFilterStatus === "amarillo") return yellows > 0;
        if (truckFilterStatus === "verde") return reds === 0 && yellows === 0;
        return true;
      });

      const totalTruckPages = Math.ceil(filteredTrucks.length / trucksPageSize) || 1;
      if (trucksCurrentPage > totalTruckPages) trucksCurrentPage = totalTruckPages;
      const startTruck = (trucksCurrentPage - 1) * trucksPageSize;

      $.innerHTML = `

            </div>
          </div>

              <span class="text-xs font-semibold text-[var(--muted)] mr-1">Filtrar Estado:</span>
              ${[

                ["amarillo", `En Zona Amarilla`],

            <div class="flex items-center gap-2 self-end md:self-auto text-xs">

                <option value="24" ${trucksPageSize === 24 ? 'selected' : ''}>24 por pág</option>
                <option value="67" ${trucksPageSize >= 67 ? 'selected' : ''}>Ver Todos (${state.trucks.length})</option>

              <button onclick="if(trucksCurrentPage>1){trucksCurrentPage--; renderTrucks();}" ${trucksCurrentPage === 1 ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg bg-[var(--bg)] hover:bg-[var(--card-hover)] disabled:opacity-30 border border-[var(--border)] font-semibold">‹ Ant</button>
              <span class="font-mono">${trucksCurrentPage} / ${totalTruckPages}</span>
              <button onclick="if(trucksCurrentPage<totalTruckPages){trucksCurrentPage++; renderTrucks();}" ${trucksCurrentPage === totalTruckPages ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg bg-[var(--bg)] hover:bg-[var(--card-hover)] disabled:opacity-30 border border-[var(--border)] font-semibold">Sig ›</button>
            </div>

              const yellows = truckTires.filter(t => zona(t.h) === "amarillo").length;
              const maxDamage = Math.max(...truckTires.map(t => t.nivel));

                        <span class="text-xs px-2.5 py-0.5 rounded-full bg-[var(--bg)] border border-[var(--border)] text-[var(--muted)] font-mono">${truck[1] || "Cat 793F"}</span>
                      </div>
                      <div class="text-xs text-[var(--muted)] mt-1 flex items-center gap-2">
                        <span>Horómetro: <strong class="text-[var(--ink)] font-mono">${truck[2] || "15.000 h"}</strong></span>
                        <span>·</span>
                        <span>6 Neumáticos 59/80R63</span>

                    <div class="flex justify-around items-center mb-6">
                      ${[1, 2].map(pNum => {

                        const bgCol = z === 'rojo' ? 'border-rose-500 bg-rose-500/10' : z === 'amarillo' ? 'border-amber-500 bg-amber-500/10' : 'border-emerald-500 bg-emerald-500/10';
                        const labelPos = ["Ext Izq", "Int Izq", "Int Der", "Ext Der"][pNum - 3];
                        return `

                            <div class="text-[11px] font-bold text-[var(--ink)]">P${t.pos}</div>

                            <div class="text-[10px] text-[var(--muted)] font-mono">${f(t.mm)}mm</div>

    function renderTireWearChart(t) {
      const historicalPoints = Array.from({ length: 8 }, (_, i) => +(t.mm + (7 - i) * t.rate).toFixed(2));
      const minVal = Math.min(19, t.mm - 1);
      const maxVal = Math.max(...historicalPoints) + 1;
      const getX = i => 40 + i * 42;
      const getY = v => 15 + ((maxVal - v) / (maxVal - minVal)) * 110;

      const thresholdY = getY(20);

      return `
        <svg viewBox="0 0 380 160" class="w-full h-auto block" role="img">
          <!-- Línea umbral crítico 20mm -->
          <line x1="40" y1="${thresholdY}" x2="360" y2="${thresholdY}" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="2"/>
          <text x="360" y="${thresholdY - 5}" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#ef4444">Umbral de retiro 20,0 mm</text>

          <!-- Polilínea de mediciones históricas -->
          <polyline fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${historicalPoints.map((v, i) => `${getX(i)},${getY(v)}`).join(" ")}"/>
          
          <!-- Puntos de medición -->
          ${historicalPoints.map((v, i) => `
            <circle cx="${getX(i)}" cy="${getY(v)}" r="4.5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
            <text x="${getX(i)}" y="${getY(v) - 8}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#94a3b8">${f(v)}</text>
          `).join("")}

          <!-- Eje X etiquetas -->
          <text x="200" y="152" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#64748b">Últimas 8 pasadas por el pórtico</text>
        </svg>
      `;
    }

    function corregirClasificacion(serial, newLevel) {
      const t = ST(serial);
      if (!t) return;
      
      const prevLevel = t.nivel;
      state.damages[(t.cx.split("-")[1]) + "-" + t.pos] = newLevel > 0 
        ? [newLevel, ["", "desgaste irregular", "roca incrustada en la banda", "corte profundo en flanco"][newLevel], 1.0]
        : null;

      saveState();
      showToast(`Clasificación actualizada de ${DAMAGE_NAMES[prevLevel]} a ${DAMAGE_NAMES[newLevel]} (registrado en auditoría)`, "info");
      renderTireDetail(serial);
      const desc = state.damages[t.cx.split("-")[1] + "-" + t.pos]?.[1];
      persistir(() => DB.registrarDano(serial, newLevel, desc));
    }

    // --- PANTALLA 4: AGENDAR INTERVENCIÓN EN TALLER ---
    let selectedWindowId = null;

    function renderSchedule(serial) {
      updateActiveNav("");
      const t = ST(serial);
      if (!t) return navigate("#/");

      const selectedWin = state.windows.find(w => w.id === selectedWindowId);

      $.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="flex items-center gap-3 pb-3 border-b border-[var(--border)]">
            <button onclick="navigate('#/n/${serial}')" class="p-2 rounded-xl bg-[var(--card)] hover:bg-[var(--card-hover)] border border-[var(--border)] text-[var(--ink)]">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-[var(--ink)]">Agendar Intervención</h1>
              <p class="text-xs text-[var(--muted)] font-mono">${serial} · ${t.cx} ${t.posNombre} · ${H(t.h)} remanentes</p>
            </div>
          </div>

          <!-- Selección de Ventana de Taller -->
          <div class="space-y-3">
            <div class="text-sm font-semibold text-[var(--ink)]">Selecciona una Ventana Disponible en el Taller de Neumáticos:</div>
            
            <div class="grid grid-cols-1 gap-3">
              ${state.windows.map(w => {
                const isSelected = selectedWindowId === w.id;
                const hasSlots = w.libres > 0;
                const arrivesOnTime = w.en < t.h;

                return `
                  <button onclick="${hasSlots ? `selectedWindowId=${w.id}; renderSchedule('${serial}')` : ''}" class="w-full text-left p-4 rounded-2xl border-2 transition-all ${isSelected ? 'border-blue-500 bg-blue-500/10 shadow-md' : 'border-[var(--border)] bg-[var(--card)] hover:bg-[var(--card-hover)]'} ${!hasSlots ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}">
                    <div class="flex items-center justify-between">
                      <div>
                        <div class="text-base font-bold text-[var(--ink)]">${w.dia} · ${w.turno}</div>

                      </div>
                      <div class="text-right">
                        <span class="text-xs font-bold font-mono px-2.5 py-1 rounded-full ${hasSlots ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30'}">
                          ${w.libres} de ${w.max} cupos libres
                        </span>
                      </div>
                    </div>

                    ${isSelected ? `
                      <div class="mt-3 pt-3 border-t border-[var(--border)] text-xs flex items-center gap-2">
                        ${arrivesOnTime ? `
                          <span class="text-emerald-400 font-semibold flex items-center gap-1">
                            ✓ Ventana oportuna: La intervención se ejecutará con ${t.h - w.en} h de margen antes del cruce de umbral.
                          </span>
                        ` : `
                          <span class="text-rose-400 font-semibold flex items-center gap-1">
                            ⚠️ Advertencia de riesgo: El neumático cruzará el umbral ${w.en - t.h} h antes de esta ventana.
                          </span>
                        `}
                      </div>
                    ` : ''}
                  </button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- Resumen de la Orden a Emitir -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 space-y-3">

            <div class="p-3 bg-[var(--bg)] rounded-xl text-xs font-mono text-[var(--muted)] space-y-1">
              <div>Tipo de Intervención: <strong>RETIRO PROGRAMADO</strong></div>
              <div>Banda Medida: <strong>${f(t.mm)} mm</strong> (contra umbral 20,0 mm)</div>

              <span>Confirmar y Emitir Orden en SAP PM</span>
            </button>
          </div>

        </div>
      `;
    }

    function emitirOrden(serial) {
      const t = ST(serial);
      const w = state.windows.find(x => x.id === selectedWindowId);
      if (!t || !w) return;

      w.libres--;
      const newId = siguienteCodigoOrden();
      const nowStr = new Date().toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" });

      const newOrder = [
        newId,
        nowStr,
        serial,
        "retiro",
        `Retiro programado por proyección de ${t.h} h remanentes a la tasa ${t.seg} de ${f(t.rate)} mm/100 h; banda en ${f(t.mm)} mm contra umbral de 20 mm.${t.dmg.length ? " Daño: " + t.dmg[0].t + "." : ""} Ingresa serial de bodega 5980R63-B-544. Dejar en cancha de garantía para informe semanal.`,
        w.dia,
        w.turno,
        t.h,
        "med-2498",
        `${f(t.mm)} mm, tasa ${t.seg}`,
        "programada",
        [`${nowStr} · planificador · orden emitida con éxito y sincronizada con ERP`]
      ];

      state.orders.unshift(newOrder);
      saveState();

      selectedWindowId = null;
      showToast(`Orden ${newId} emitida con éxito en ERP. Taller notificado.`, "success");
      navigate("#/o");
      persistir(() => DB.emitirOrden({
        codigo: newId, serial, ventanaId: w.id, tipo: "retiro", nota: newOrder[4], horas: t.h, origen: newOrder[9]
      }));
    }

    // --- PANTALLA 5: ÓRDENES DE TRABAJO ---
    let filterOrderStatus = "todos";
    let filterOrderType = "todos";
    let searchOrderQuery = "";
    let openNotes = {};

    function renderOrders() {
      updateActiveNav("nav-ordenes");
      const counts = {
        programada: state.orders.filter(o => o[10] === "programada").length,
        ejecutada: state.orders.filter(o => o[10] === "ejecutada").length + 54,
        anulada: state.orders.filter(o => o[10] === "anulada").length + 7
      };

      const filtered = state.orders.filter(o => {
        const matchStatus = filterOrderStatus === "todos" || o[10] === filterOrderStatus;
        const matchType = filterOrderType === "todos" || o[3] === filterOrderType;
        const matchText = (o[0] + o[2] + o[4]).toLowerCase().includes(searchOrderQuery.toLowerCase());
        return matchStatus && matchType && matchText;
      });

      $.innerHTML = `
        <div class="space-y-6">

    // --- PANTALLA 7: SIMULADOR DE PASADA POR PÓRTICO (DEMO DE CAPTURA P-100) ---
    let simSelectedTruck = "CAEX-102";

    // --- TELEMETRÍA DE LA PASADA (TPMS, TEMPERATURA, CARGA) ---
    // Datos SIMULADOS y deterministas: el mismo neumático muestra los mismos valores hasta la siguiente pasada.
    // Umbrales en un solo lugar para poder ajustarlos con el equipo.
    const UMBRAL_TEMP = { advertencia: 85, critico: 95 };      // °C · el crítico (>95 °C) es el que ya usa el proyecto
    const PRESION_NOMINAL_PSI = 102;                           // 59/80R63 en frío (supuesto; ajustar por fabricante)
    const PSI_A_BAR = 0.0689476;
    const UMBRAL_PRESION = { advertencia: 5, critico: 10 };    // % de desviación respecto de la nominal
    const TKPH_REFERENCIA = 900;                               // el mismo supuesto de docs/modelo.md
    const MODELOS_CAEX = {                                     // peso vacío y carga nominal (t)
      "Cat 793F": { vacio: 160, nominal: 227 },
      "Komatsu 930E-4": { vacio: 200, nominal: 290 },
      "Cat 797F": { vacio: 260, nominal: 363 }
    };
    const ESTADOS_SENSOR = {
      operativo: { txt: "Operativo", cls: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30", dot: "bg-emerald-400" },
      sin_senal: { txt: "Sin señal", cls: "bg-slate-500/15 text-slate-300 border-slate-500/40", dot: "bg-slate-400" },
      falla: { txt: "Falla / calibración", cls: "bg-amber-500/15 text-amber-400 border-amber-500/40", dot: "bg-amber-400" }
    };
    const NIVEL = {
      normal: { txt: "Normal", cls: "text-emerald-400", chip: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30", orden: 0 },
      advertencia: { txt: "Advertencia", cls: "text-amber-400", chip: "bg-amber-500/15 text-amber-400 border-amber-500/30", orden: 1 },
      critico: { txt: "Crítico", cls: "text-rose-400", chip: "bg-rose-500/15 text-rose-400 border-rose-500/40", orden: 2 },
      sin_dato: { txt: "Sin dato", cls: "text-slate-400", chip: "bg-slate-500/15 text-slate-300 border-slate-500/40", orden: 1 }
    };

    const SIM_VISTA_PREDETERMINADA = "operador";  // decisión del equipo: la pasada se muestra resumida
    let simVista = SIM_VISTA_PREDETERMINADA;     // "operador" (resumen) o "ingenieria" (detalle)
    let simAbiertas = {};                 // secciones plegables abiertas en la vista actual

    // Generador pseudoaleatorio con semilla (mulberry32) para que los valores no cambien en cada render
    function aleatorio(semillaTexto) {
      let h = 1779033703;
      for (const ch of semillaTexto) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353);
      return () => {
        h = (h + 0x6D2B79F5) | 0;
        let t = Math.imul(h ^ (h >>> 15), 1 | h);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const nivelTemp = c => c == null ? "sin_dato" : c > UMBRAL_TEMP.critico ? "critico" : c >= UMBRAL_TEMP.advertencia ? "advertencia" : "normal";
    const nivelPresion = desv => desv == null ? "sin_dato"
      : Math.abs(desv) > UMBRAL_PRESION.critico ? "critico" : Math.abs(desv) > UMBRAL_PRESION.advertencia ? "advertencia" : "normal";
    const GRAVEDAD = { normal: 0, sin_dato: 1, advertencia: 2, critico: 3 };
    const peorNivel = (...n) => n.reduce((a, b) => GRAVEDAD[b] > GRAVEDAD[a] ? b : a, "normal");

    function telemetriaPasada(truck, tires) {
      const pasada = (state.simPasadas || {})[truck[0]] || 0;
      const r = aleatorio(`${truck[0]}#${pasada}`);
      const modelo = MODELOS_CAEX[truck[1]] || MODELOS_CAEX["Cat 793F"];
      const carga = modelo.nominal * (0.94 + r() * 0.14);       // pesaje del CAEX en el último ciclo
      const velOperacion = 17 + r() * 8;                        // km/h media del último ciclo (despacho)
      const velPasada = 2.4 + r() * 2.4;                        // km/h al cruzar el pórtico
      const pesoMedio = modelo.vacio + carga / 2;
      const neumaticos = tires.map(t => {
        const rt = aleatorio(`${t.serial}#${pasada}`);
        const delantera = t.pos <= 2;
        const qNeumatico = pesoMedio * (delantera ? 0.33 / 2 : 0.67 / 4);
        const [rEstado, rDesv, rInterna, rHoras] = [rt(), rt(), rt(), rt()];  // siempre en el mismo orden
        const estadoSensor = (state.tpmsSensores || {})[t.serial]
          || (rEstado < 0.08 ? "sin_senal" : rEstado < 0.13 ? "falla" : "operativo");
        const desv = -9 + rDesv * 15 + (t.temp - 80) * 0.15;      // la presión en caliente sube con la temperatura
        const psi = PRESION_NOMINAL_PSI * (1 + desv / 100);
        const leePresion = estadoSensor === "operativo";
        return {
          ...t,
          estadoSensor,
          psi: leePresion ? psi : null,
          bar: leePresion ? psi * PSI_A_BAR : null,
          desvPresion: leePresion ? desv : null,
          tempInterna: estadoSensor === "sin_senal" ? null : t.temp - 6 - rInterna * 5,  // sensor TPMS en la válvula
          tempExterna: t.temp,                                    // termografía del pórtico (flanco)
          ultimaLectura: leePresion ? "en esta pasada" : `hace ${Math.round(2 + rHoras * 40)} h`,
          tkph: qNeumatico * velOperacion,
          cargaNeumatico: qNeumatico
        };
      });
      neumaticos.forEach(n => {
        n.nivelPresion = estadoSensorSinDato(n) ? "sin_dato" : nivelPresion(n.desvPresion);
        n.nivelTemp = nivelTemp(n.tempExterna);
        n.nivelZona = { rojo: "critico", amarillo: "advertencia", verde: "normal", gris: "sin_dato" }[zona(n.h)];
        n.nivelGeneral = peorNivel(n.nivelPresion, n.nivelTemp, n.nivelZona, n.nivel >= 3 ? "critico" : n.nivel === 2 ? "advertencia" : "normal");
      });
      return { carga, cargaNominal: modelo.nominal, velOperacion, velPasada, neumaticos };
    }

    function alertasPasada(tel) {
      const a = [];
      tel.neumaticos.forEach(n => {

        if (n.nivelTemp === "critico") a.push(["critico", `${p}: ${n.tempExterna} °C en el flanco (sobre ${UMBRAL_TEMP.critico} °C)`]);
        else if (n.nivelTemp === "advertencia") a.push(["advertencia", `${p}: ${n.tempExterna} °C en el flanco (sobre ${UMBRAL_TEMP.advertencia} °C)`]);
        if (n.nivelPresion === "critico") a.push(["critico", `${p}: presión ${n.desvPresion > 0 ? "alta" : "baja"} (${f(n.desvPresion.toFixed(1))} % vs nominal)`]);
        else if (n.nivelPresion === "advertencia") a.push(["advertencia", `${p}: presión ${n.desvPresion > 0 ? "alta" : "baja"} (${f(n.desvPresion.toFixed(1))} % vs nominal)`]);
        if (n.estadoSensor !== "operativo") a.push(["advertencia", `${p}: sensor TPMS ${ESTADOS_SENSOR[n.estadoSensor].txt.toLowerCase()}, presión sin lectura`]);
        if (n.nivel >= 3) a.push(["critico", `${p}: daño crítico (${n.dmg[0]?.t || "nivel 3"})`]);
        if (zona(n.h) === "rojo") a.push(["critico", `${p}: ${n.h} h remanentes (zona roja)`]);
      });
      if (tel.velPasada > 5 || tel.velPasada < 2) a.push(["advertencia", `Velocidad de pasada ${f(tel.velPasada.toFixed(1))} km/h fuera del rango de captura (2 a 5 km/h)`]);
      if (tel.carga > tel.cargaNominal * 1.05) a.push(["advertencia", `Sobrecarga: ${Math.round(tel.carga)} t (${f(((tel.carga / tel.cargaNominal - 1) * 100).toFixed(1))} % sobre la nominal)`]);
      return a.sort((x, y) => GRAVEDAD[y[0]] - GRAVEDAD[x[0]]);

    function ejecutarPasadaPortico() {
      isSimulating = true;

      const truckSim = state.trucks.find(c => c[0] === simSelectedTruck);
      const telSim = telemetriaPasada(truckSim, getTires().filter(t => t.cx === simSelectedTruck));
      const hora = () => new Date().toLocaleTimeString();
      simLog = [
        `[${hora()}] Inicializando sincronización en PÓRTICO DIMENSIONAL P-100 para ${simSelectedTruck}...`,
        `[${hora()}] Velocidad detectada: ${f(telSim.velPasada.toFixed(1))} km/h (${telSim.velPasada >= 2 && telSim.velPasada <= 5 ? 'dentro del' : 'FUERA del'} rango de captura 2 a 5 km/h)`,
        `[${new Date().toLocaleTimeString()}] Arreglo de 8 cámaras (CAM-101 a CAM-108) sincronizado con escáner LiDAR 3D...`
      ];
      renderSimulator();

      setTimeout(() => {
        const truckIndex = state.trucks.findIndex(c => c[0] === simSelectedTruck);
        if (truckIndex >= 0) {
          const truckTires = state.trucks[truckIndex][3];
          for (let p = 0; p < 6; p++) {
            const key = simSelectedTruck.split("-")[1] + "-" + (p + 1);
            const deltaHours = Math.floor(Math.random() * 25) + 15;
            truckTires[p] = Math.max(20, truckTires[p] - deltaHours);

            if (state.knownTires[key]) {
              state.knownTires[key][1] = +(state.knownTires[key][1] - 0.2).toFixed(1);
              state.knownTires[key][3] = new Date().toLocaleDateString("es-CL");
            }
          }
        }

        const camsOk = state.cameras.filter(c => c.estado === "buena").length;
        const tpmsOk = telSim.neumaticos.filter(n => n.estadoSensor === "operativo").length;
        simLog.push(
          `[${hora()}] ${camsOk === state.cameras.length ? '✓' : '⚠'} ${camsOk} de ${state.cameras.length} cámaras operativas.`,
          `[${hora()}] ${tpmsOk === 6 ? '✓' : '⚠'} TPMS: ${tpmsOk} de 6 sensores transmitieron presión y temperatura interna.`,
          `[${hora()}] Termografía de flancos: máx. ${Math.max(...telSim.neumaticos.map(n => n.tempExterna))} °C · Carga del ciclo: ${Math.round(telSim.carga)} t.`,
          `[${new Date().toLocaleTimeString()}] ✓ 6 de 6 neumáticos escaneados con nubes de puntos 3D.`,

        );

        saveState();

        renderSimulator();

        const horometro = parseInt((state.trucks[truckIndex]?.[2] || "0").replace(/\D/g, ""), 10) || 0;
        const lecturas = getTires().filter(t => t.cx === simSelectedTruck)
          .map(t => ({ serial: t.serial, h: t.h, mm: t.mm, rate: t.rate, temp: t.temp, horometro }));
        persistir(() => DB.registrarPasada(lecturas));
      }, 2500);
    }

    // --- PANTALLA 8: EXPLORADOR DE DATOS ---
    const TABLAS_DATOS = [
      { id: "mediciones", nombre: "Mediciones", desc: "Una fila por neumático en cada pasada por el pórtico: profundidad, tasa, temperatura, horas remanentes y zona. Es la tabla que crece con cada pasada.", orden: "fecha_pasada" },
      { id: "danos_neumaticos", nombre: "Daños", desc: "Daños detectados por visión artificial y correcciones del planificador (validado_por_humano).", orden: "fecha_registro" },
      { id: "neumaticos", nombre: "Neumáticos", desc: "Un neumático por serial, con su camión y posición (P1 a P6).", orden: "serial" },
      { id: "camiones", nombre: "Camiones", desc: "Flota CAEX con modelo y horómetro.", orden: "codigo" },
      { id: "ordenes_trabajo", nombre: "Órdenes de trabajo", desc: "OT emitidas, con la medición de origen, la ventana del taller y su estado.", orden: "fecha_emision" },
      { id: "historial_ordenes", nombre: "Historial de OT", desc: "Cada creación, modificación o anulación de una OT, con su motivo.", orden: "fecha_evento" },
      { id: "ventanas_taller", nombre: "Ventanas del taller", desc: "Turnos del taller y cupos libres (los ajustan los triggers).", orden: "dia" },
      { id: "vista_tablero_turno", nombre: "Vista del tablero", desc: "Consulta calculada: última medición y último daño de cada neumático montado. Es lo que muestra el Tablero.", orden: "horas_remanentes_calculadas" }
    ];
    let datosTabla = "mediciones", datosCache = {}, datosBusqueda = "", datosOrden = null, datosDesc = true, datosPagina = 1;
    const DATOS_POR_PAGINA = 50;

    // En modo local (sin Supabase) se arma una versión equivalente desde el estado del prototipo
    function tablaLocal(id) {
      const tires = getTires();
      if (id === "camiones") return state.trucks.map(c => ({ codigo: c[0], modelo: c[1], horometro: c[2] }));
      if (id === "neumaticos" || id === "vista_tablero_turno" || id === "mediciones")
        return tires.map(t => ({ caex: t.cx, posicion: t.pos, serial: t.serial, profundidad_mm: t.mm, tasa_mm_100h: t.rate, tipo_tasa: t.seg,
          horas_remanentes: t.h, zona: zona(t.h), temperatura_c: t.temp, nivel_dano: t.nivel, fecha: t.fecha }));
      if (id === "danos_neumaticos") return tires.filter(t => t.nivel > 0).map(t => ({ serial: t.serial, caex: t.cx, posicion: t.pos, severidad: t.nivel, descripcion: t.dmg[0]?.t, confianza: t.dmg[0]?.c }));
      if (id === "ordenes_trabajo") return state.orders.map(o => ({ codigo: o[0], emision: o[1], serial: o[2], tipo: o[3], nota: o[4], dia: o[5], turno: o[6], horas: o[7], medicion: o[8], estado: o[10] }));
      if (id === "historial_ordenes") return state.orders.flatMap(o => (o[11] || []).map(h => ({ orden: o[0], evento: h })));
      if (id === "ventanas_taller") return state.windows.map(w => ({ id: w.id, dia: w.dia, turno: w.turno, cupos_libres: w.libres, cupos_totales: w.max, horas_hasta_ventana: w.en }));
      return [];
    }

    async function cargarTablaDatos(id, forzar = false) {
      if (datosCache[id] && !forzar) return;
      datosCache[id] = { cargando: true, filas: [] };
      try {
        datosCache[id] = { filas: DB.activo ? await DB.leerTabla(id) : tablaLocal(id), origen: DB.activo ? "Supabase" : "modo local" };
      } catch (e) {
        datosCache[id] = { filas: [], error: e.message };
      }
      if (location.hash.startsWith("#/datos")) renderDatos();
    }

    function columnasDatos(filas) {
      const cols = [...new Set(filas.flatMap(f => Object.keys(f)))];
      const esId = c => c === "id" || c.endsWith("_id");
      return [...cols.filter(c => !esId(c)), ...cols.filter(esId)];   // los identificadores técnicos al final
    }

    function filasFiltradasDatos() {
      const t = datosCache[datosTabla];
      if (!t || !t.filas) return [];
      const q = datosBusqueda.trim().toLowerCase();
      let filas = q ? t.filas.filter(f => Object.values(f).some(v => String(v ?? "").toLowerCase().includes(q))) : [...t.filas];
      const col = datosOrden || TABLAS_DATOS.find(x => x.id === datosTabla).orden;
      if (filas.length && col in filas[0]) {
        filas.sort((a, b) => {
          const x = a[col], y = b[col];
          const r = typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""), "es", { numeric: true });
          return datosDesc ? -r : r;
        });
      }
      return filas;
    }

    function descargarCSVDatos() {
      const filas = filasFiltradasDatos();
      if (!filas.length) return;
      const cols = columnasDatos(filas);
      const celda = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [cols.join(";"), ...filas.map(f => cols.map(c => celda(f[c])).join(";"))].join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `${datosTabla}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    const formatoCelda = (c, v) => {
      if (v == null) return `<span class="text-[var(--muted)]">—</span>`;
      const txt = String(v);
      if (/^\d{4}-\d{2}-\d{2}T/.test(txt)) return new Date(txt).toLocaleString("es-CL", { dateStyle: "short", timeStyle: "short" });
      if (c === "id" || c.endsWith("_id")) return `<span title="${txt}" class="text-[var(--muted)]">${txt.slice(0, 8)}…</span>`;
      if (txt.length > 70) return `<span title="${txt.replace(/"/g, "&quot;")}">${txt.slice(0, 70)}…</span>`;
      return txt;
    };

    function renderDatos() {
      updateActiveNav("nav-datos");
      const t = datosCache[datosTabla];
      if (!t) { cargarTablaDatos(datosTabla); }
      const meta = TABLAS_DATOS.find(x => x.id === datosTabla);
      const filas = filasFiltradasDatos();
      const cols = filas.length ? columnasDatos(filas) : [];
      const paginas = Math.max(1, Math.ceil(filas.length / DATOS_POR_PAGINA));
      datosPagina = Math.min(datosPagina, paginas);
      const visibles = filas.slice((datosPagina - 1) * DATOS_POR_PAGINA, datosPagina * DATOS_POR_PAGINA);
      const colOrden = datosOrden || meta.orden;

      $.innerHTML = `
        <div class="space-y-5">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-3 pb-3 border-b border-[var(--border)]">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-[var(--ink)]">Explorador de datos</h1>
              <p class="text-sm text-[var(--muted)] mt-1">Todas las tablas que alimentan el prototipo, fila por fila. Origen: <strong class="text-[var(--ink)]">${DB.activo ? "Supabase (en vivo)" : "modo local del navegador"}</strong>.</p>
            </div>
            <button onclick="navigate('#/modelos')" class="text-xs px-3.5 py-2 rounded-xl border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--card-hover)] text-[var(--ink)]">¿Cómo se usan estos datos? Ver modelos ›</button>
          </div>

          <div class="flex flex-wrap gap-1.5">
            ${TABLAS_DATOS.map(x => {
              const n = datosCache[x.id]?.filas?.length;
              return `<button onclick="datosTabla='${x.id}'; datosBusqueda=''; datosOrden=null; datosDesc=true; datosPagina=1; renderDatos()" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all ${datosTabla === x.id ? 'bg-blue-600 text-white shadow-md' : 'bg-[var(--card)] text-[var(--muted)] hover:text-[var(--ink)] border border-[var(--border)]'}">
                ${x.nombre}${n != null && !datosCache[x.id].cargando ? ` <span class="opacity-70 font-mono">${n.toLocaleString("es-CL")}</span>` : ""}
              </button>`;
            }).join("")}
          </div>

          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 space-y-3">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
              <div>
                <div class="text-sm font-bold text-[var(--ink)]">${meta.nombre} <code class="text-xs font-normal text-[var(--muted)]">${meta.id}</code></div>
                <div class="text-xs text-[var(--muted)] mt-0.5">${meta.desc}</div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <input id="datos-busqueda" type="text" placeholder="Buscar en todas las columnas..." value="${datosBusqueda.replace(/"/g, "&quot;")}" oninput="datosBusqueda=this.value; datosPagina=1; renderDatos(); enfocarAlFinal('datos-busqueda');" class="w-56 px-3 py-2 rounded-xl bg-[var(--bg)] border border-[var(--border)] text-xs text-[var(--ink)] focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                <button onclick="cargarTablaDatos('${datosTabla}', true)" class="px-3 py-2 rounded-xl border border-[var(--border)] text-xs text-[var(--muted)] hover:text-[var(--ink)]" title="Volver a leer desde la base">↻ Recargar</button>
                <button onclick="descargarCSVDatos()" ${filas.length ? "" : "disabled"} class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white text-xs font-semibold">Descargar CSV (${filas.length.toLocaleString("es-CL")})</button>
              </div>
            </div>

            ${!t || t.cargando ? `<div class="py-12 text-center text-sm text-[var(--muted)]">Cargando ${meta.nombre.toLowerCase()} desde ${DB.activo ? "Supabase" : "el navegador"}…</div>`
              : t.error ? `<div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-sm text-rose-400">No se pudo leer la tabla: ${t.error}</div>`
              : !filas.length ? `<div class="py-12 text-center text-sm text-[var(--muted)]">Sin filas${datosBusqueda ? " para esa búsqueda" : ""}.</div>`
              : `
              <div class="overflow-auto max-h-[65vh] rounded-xl border border-[var(--border)]">
                <table class="w-full text-xs">
                  <thead class="sticky top-0 bg-[var(--bg)] z-10">
                    <tr>${cols.map(c => `
                      <th onclick="datosDesc = datosOrden === '${c}' ? !datosDesc : false; datosOrden='${c}'; renderDatos()" class="p-2 text-left font-mono text-[10px] uppercase tracking-wider text-[var(--muted)] whitespace-nowrap cursor-pointer hover:text-[var(--ink)]">
                        ${c}${c === colOrden ? (datosDesc ? " ▼" : " ▲") : ""}
                      </th>`).join("")}</tr>
                  </thead>
                  <tbody>
                    ${visibles.map(f => `<tr class="border-t border-[var(--border)] hover:bg-[var(--card-hover)]">${cols.map(c => `<td class="p-2 font-mono whitespace-nowrap text-[var(--ink)]">${formatoCelda(c, f[c])}</td>`).join("")}</tr>`).join("")}
                  </tbody>
                </table>
              </div>
              <div class="flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-[var(--muted)]">
                <span>Filas ${((datosPagina - 1) * DATOS_POR_PAGINA + 1).toLocaleString("es-CL")} a ${Math.min(datosPagina * DATOS_POR_PAGINA, filas.length).toLocaleString("es-CL")} de ${filas.length.toLocaleString("es-CL")} · ${cols.length} columnas · clic en un encabezado para ordenar</span>
                <div class="flex items-center gap-1">
                  <button onclick="datosPagina=Math.max(1,datosPagina-1); renderDatos()" ${datosPagina === 1 ? "disabled" : ""} class="px-2.5 py-1 rounded-lg border border-[var(--border)] disabled:opacity-30">‹ Ant</button>
                  <span class="px-2 font-mono">${datosPagina} / ${paginas}</span>
                  <button onclick="datosPagina=Math.min(${paginas},datosPagina+1); renderDatos()" ${datosPagina === paginas ? "disabled" : ""} class="px-2.5 py-1 rounded-lg border border-[var(--border)] disabled:opacity-30">Sig ›</button>
                </div>
              </div>`}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-[var(--muted)]">
            <div class="p-4 rounded-2xl bg-[var(--card)] border border-[var(--border)]"><strong class="text-[var(--ink)]">¿Qué datos se generan?</strong> Cada pasada por el pórtico agrega 6 filas a <em>Mediciones</em> (una por neumático). Las correcciones de daño, las OT y sus cambios agregan filas a sus tablas. Ninguna fila se borra.</div>
            <div class="p-4 rounded-2xl bg-[var(--card)] border border-[var(--border)]"><strong class="text-[var(--ink)]">¿Qué no está aquí?</strong> La telemetría TPMS, carga y TKPH del simulador es simulada y no se guarda. Los datos de entrenamiento del modelo (96.697 ciclos sintéticos) se generan con <code>modelo/generar_datos.py</code>; ver la página Modelos.</div>
          </div>
        </div>`;
    }

    // --- PANTALLA 9: CÓMO FUNCIONAN LOS MODELOS ---
    let modelosMetricas = null;

    function renderModelos() {
      updateActiveNav("nav-modelos");
      if (!modelosMetricas) {
        fetch("./assets/modelo/metricas.json").then(r => r.json()).then(m => { modelosMetricas = m; if (location.hash === "#/modelos") renderModelos(); })
          .catch(() => { modelosMetricas = {}; });
      }
      const m = modelosMetricas || {};
      const rul = m.rul || {};
      const r30 = rul.a_30_mm, r45 = rul.a_45_mm;
      const ejemplo = getTires().filter(t => zona(t.h) === "rojo").sort((a, b) => a.h - b.h)[0] || getTires()[0];
      const tarjeta = (titulo, cuerpo) => `<div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 space-y-3">${titulo ? `<h2 class="text-lg font-bold text-[var(--ink)]">${titulo}</h2>` : ""}${cuerpo}</div>`;

        <div class="flex gap-3">

            <p class="text-sm text-[var(--muted)] mt-1">De la medición del pórtico a la decisión del planificador. Los resultados de aprendizaje son de una prueba de concepto con <strong class="text-amber-400">datos sintéticos</strong>: validan el método, no el desempeño en faena.</p>

              <div class="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400"><strong>Verde</strong> · más de 500 h<br>operación normal</div>

            <p class="text-xs text-[var(--muted)]">La tasa se calcula con una <strong>recta</strong> sobre las mediciones del neumático (<code>backend/app/proyeccion.py</code>). Es simple y explicable, pero supone que las condiciones de operación no cambian. Los modelos de aprendizaje buscan corregir eso.</p>`)}

          ${tarjeta("2. De los datos a la decisión", `

              ${modelo("Supervivencia (Cox)", POC, "¿Qué riesgo tiene de un daño súbito (corte, impacto)?", "Usa la vida completa de cada neumático, incluidos los que se retiraron antes de fallar (datos censurados).", "Razón de riesgo de cada factor (ej. roca suelta ×3).")}

          ${tarjeta("4. Resultados de la prueba de concepto", `
            <p class="text-xs text-[var(--muted)]">Datos sintéticos de 1.610 vidas de neumático en 67 CAEX, con efectos conocidos. Se evaluó en ${m.camiones_prueba || 14} camiones que el modelo nunca vio.</p>

                  <tr class="border-t border-[var(--border)]"><td class="p-2.5">30 mm · estimaciones dentro de ±200 h</td><td class="p-2.5 text-right font-mono">${f(r30.recta.dentro_200h_pct)} %</td><td class="p-2.5 text-right font-mono text-emerald-400 font-bold">${f(r30.modelo.dentro_200h_pct)} %</td></tr>
                  <tr class="border-t border-[var(--border)]"><td class="p-2.5">30 mm · estimaciones optimistas (retirar tarde)</td><td class="p-2.5 text-right font-mono">${f(r30.recta.optimista_pct)} %</td><td class="p-2.5 text-right font-mono text-emerald-400 font-bold">${f(r30.modelo.optimista_pct)} %</td></tr>

            </div>` : `<p class="text-xs text-[var(--muted)]">Cargando métricas…</p>`}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <figure class="rounded-xl overflow-hidden border border-[var(--border)] bg-white"><img src="./assets/modelo/importancia_shap.png" alt="Importancia SHAP de cada variable" class="w-full"><figcaption class="p-2 text-[11px] text-slate-600 bg-slate-100">Qué variables explican el desgaste. La temperatura del neumático aparece alta aunque es consecuencia, no causa: importancia no es causalidad.</figcaption></figure>
              <figure class="rounded-xl overflow-hidden border border-[var(--border)] bg-white"><img src="./assets/modelo/rul_30mm.png" alt="Horas remanentes estimadas contra reales" class="w-full"><figcaption class="p-2 text-[11px] text-slate-600 bg-slate-100">Cada punto es un neumático. Cuanto más cerca de la diagonal, mejor. La franja es ±200 h.</figcaption></figure>
              <figure class="md:col-span-2 rounded-xl overflow-hidden border border-[var(--border)] bg-white"><img src="./assets/modelo/recuperacion_efectos.png" alt="Efectos verdaderos contra estimados" class="w-full max-w-2xl mx-auto"><figcaption class="p-2 text-[11px] text-slate-600 bg-slate-100">La regresión recupera los efectos que el simulador usó (gris) en la mayoría de las variables. Falla donde el efecto real no es lineal (presión baja, pendiente).</figcaption></figure>
            </div>`)}

          ${tarjeta("5. Qué falta para usarlo en faena", `
            <ul class="text-sm text-[var(--muted)] list-disc pl-5 space-y-1">
              <li><strong class="text-[var(--ink)]">Datos reales:</strong> acceso a TPMS, pesaje y despacho de la faena (tabla <code>ciclos_operacion</code> en Supabase).</li>
              <li><strong class="text-[var(--ink)]">Validación con el planificador</strong> en la Semana 7: que los motivos mostrados sean comprensibles y útiles.</li>
              <li><strong class="text-[var(--ink)]">Integración:</strong> reemplazar la recta del tablero por la tasa prevista y mostrar en la ficha las 3 causas principales de cada alerta.</li>
              <li><strong class="text-[var(--ink)]">Supuestos a revisar:</strong> el tamaño de cada efecto en el simulador viene de literatura y criterio del equipo, no de mediciones.</li>
            </ul>
            <div class="flex flex-wrap gap-2 pt-1">
              <a href="https://github.com/mavalosc/control-neumaticos-caex/blob/main/docs/modelo.md" target="_blank" rel="noopener" class="text-xs px-3 py-1.5 rounded-xl border border-[var(--border)] hover:bg-[var(--card-hover)] text-[var(--ink)]">Metodología completa (docs/modelo.md) ↗</a>
              <a href="https://github.com/mavalosc/control-neumaticos-caex/blob/main/modelo/resultados/REPORTE.md" target="_blank" rel="noopener" class="text-xs px-3 py-1.5 rounded-xl border border-[var(--border)] hover:bg-[var(--card-hover)] text-[var(--ink)]">Reporte de resultados ↗</a>
              <button onclick="navigate('#/datos')" class="text-xs px-3 py-1.5 rounded-xl border border-[var(--border)] hover:bg-[var(--card-hover)] text-[var(--ink)]">Ver los datos ›</button>
            </div>`)}
        </div>`;
    }

    // --- PANTALLA 10: AYUDA (MANUAL DE USO) ---
    // El manual se escribe una sola vez en src/manual.md y se muestra aquí; también se lee en GitHub y en PDF.
    const AYUDA_POR_PANTALLA = { "": "tablero", c: "camiones", n: "ficha", a: "agendar", o: "ordenes", e: "modificar",
                                 sim: "simulador", datos: "datos", modelos: "modelos" };
    let manualHTML = null;

    function abrirAyudaContextual() {
      const ruta = (location.hash || "#/").replace("#", "").split("/").filter(Boolean)[0] || "";
      navigate(`#/ayuda/${AYUDA_POR_PANTALLA[ruta] || "primeros-pasos"}`);
    }

    async function renderAyuda(seccion) {
      updateActiveNav("nav-ayuda");
      if (manualHTML === null) {
        $.innerHTML = `<div class="py-16 text-center text-sm text-[var(--muted)]">Cargando el manual…</div>`;
        try {
          const md = await (await fetch("./manual.md", { cache: "no-cache" })).text();
          manualHTML = window.marked ? marked.parse(md) : `<pre class="whitespace-pre-wrap">${md.replace(/</g, "&lt;")}</pre>`;
        } catch (e) {
          manualHTML = `<p class="text-rose-400">No se pudo cargar el manual (${e.message}).</p>`;
        }
        if (!location.hash.startsWith("#/ayuda")) return;
      }
      const tmp = document.createElement("div");
      tmp.innerHTML = manualHTML;
      const indice = [...tmp.querySelectorAll("a[id]")].map(a => {
        const bloque = a.parentElement && a.parentElement.tagName === "P" ? a.parentElement : a;  // marked envuelve el ancla en <p>
        let h = bloque.nextElementSibling;
        while (h && !/^H2$/.test(h.tagName)) h = h.nextElementSibling;
        return h ? { id: a.id, titulo: h.textContent } : null;
      }).filter(Boolean);

      $.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
          <aside class="lg:col-span-1">
            <div class="lg:sticky lg:top-24 space-y-3">
              <a href="./assets/manual/manual-control-neumaticos-caex.pdf" download class="flex items-center justify-center gap-2 w-full px-3 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3M6 20h12a2 2 0 002-2V8l-6-6H6a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                Descargar manual en PDF
              </a>
              <nav class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-3 max-h-[70vh] overflow-y-auto">
                <div class="text-[10px] font-bold uppercase tracking-wider text-[var(--muted)] px-2 pb-2">Contenido</div>
                ${indice.map(x => `<button onclick="navigate('#/ayuda/${x.id}')" class="block w-full text-left px-2 py-1.5 rounded-lg text-xs ${x.id === seccion ? 'bg-blue-600 text-white' : 'text-[var(--muted)] hover:text-[var(--ink)] hover:bg-[var(--card-hover)]'}">${x.titulo}</button>`).join("")}
              </nav>
            </div>
          </aside>
          <article class="manual lg:col-span-3 bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 sm:p-8">${manualHTML}</article>
        </div>`;

      // Los enlaces internos del manual (#seccion) navegan dentro de la ayuda
      $.querySelectorAll('.manual a[href^="#"]').forEach(a => {
        a.addEventListener("click", ev => { ev.preventDefault(); navigate(`#/ayuda/${a.getAttribute("href").slice(1)}`); });
      });
      const destino = seccion && document.getElementById(seccion);
      if (destino) {
        requestAnimationFrame(() => destino.scrollIntoView({ block: "start" }));
        // las capturas de más arriba cambian la altura al cargar: se vuelve a ubicar la sección al terminar
        const imagenes = [...$.querySelectorAll(".manual img")].filter(i => !i.complete);
        Promise.all(imagenes.map(i => new Promise(r => { i.onload = i.onerror = r; })))
          .then(() => { if (location.hash === `#/ayuda/${seccion}`) destino.scrollIntoView({ block: "start" }); });
      }
    }

    // --- ENRUTADOR PRINCIPAL ---
    let rutaAnterior = null;

    function route() {
      const hash = location.hash || "#/";
      const [path, param] = hash.replace("#", "").split("/").filter(Boolean);
      window.scrollTo(0, 0);

      if (!path) {
        renderDashboard();
      } else if (path === "c") {
        renderTrucks();
      } else if (path === "o") {
        renderOrders();
      } else if (path === "n" && param) {
        renderTireDetail(param);
      } else if (path === "a" && param) {
        renderSchedule(param);
      } else if (path === "e" && param) {
        renderEditOrder(param);
      } else if (path === "ayuda") {
        renderAyuda(param);
      } else if (path === "datos") {
        renderDatos();
      } else if (path === "modelos") {
        renderModelos();
      } else if (path === "sim") {
        if (rutaAnterior !== "sim") {             // al entrar al simulador siempre parte en la vista predeterminada
          simVista = SIM_VISTA_PREDETERMINADA;
          simAbiertas = {};
        }
        renderSimulator();
      } else {
        renderDashboard();
      }
      rutaAnterior = path || "";
      const botonAyuda = document.getElementById("ayuda-contextual");
      if (botonAyuda) botonAyuda.classList.toggle("hidden", path === "ayuda");
    }

    window.addEventListener("hashchange", route);
    window.addEventListener("DOMContentLoaded", async () => {
      if (DB.activo) {
        marcarOrigenDatos("cargando Supabase…", "bg-amber-400");
        try {
          await sincronizarDesdeBase();
          marcarOrigenDatos("Supabase", "bg-emerald-400");
        } catch (e) {
          console.error(e);
          DB.activo = false;
          marcarOrigenDatos("modo local", "bg-slate-400");
          showToast(`Sin conexión a Supabase (${e.message}). Se usan los datos locales.`, "danger");
        }
      } else {
        marcarOrigenDatos("modo local", "bg-slate-400");
      }
      route();
    });
  </script>
</body>
</html>
